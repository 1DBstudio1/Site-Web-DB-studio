<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#051a15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020c0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffc0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009e88;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadow3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004d3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002a20;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond avec bordure arrondie -->

  <rect width="100" height="100" rx="18" fill="url(#bg3d)"/>
  <rect width="100" height="100" rx="18" fill="none" stroke="#00ffc0" stroke-width="2" opacity="0.4"/>

  <!-- === LETTRE D === -->

  <!-- Ombre 3D D (décalage bas-droite) -->

<text x="10" y="68" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#shadow3d)" letter-spacing="-2">D</text>
<text x="11" y="69" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#shadow3d)" letter-spacing="-2" opacity="0.6">D</text>
<text x="12" y="70" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#shadow3d)" letter-spacing="-2" opacity="0.3">D</text>

  <!-- Face principale D -->

<text x="8" y="66" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#accentGrad)" filter="url(#glow)">D</text>

  <!-- === LETTRE B === -->

  <!-- Ombre 3D B -->

<text x="52" y="68" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#shadow3d)" letter-spacing="-2">B</text>
<text x="53" y="69" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#shadow3d)" letter-spacing="-2" opacity="0.6">B</text>
<text x="54" y="70" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#shadow3d)" letter-spacing="-2" opacity="0.3">B</text>

  <!-- Face principale B -->

<text x="50" y="66" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#accentGrad)" filter="url(#glow)">B</text>

  <!-- Ligne décorative bas -->

  <line x1="12" y1="78" x2="88" y2="78" stroke="#00ffc0" stroke-width="1.5" opacity="0.5"/>
  <line x1="12" y1="80" x2="88" y2="80" stroke="#00ffc0" stroke-width="0.5" opacity="0.2"/>
</svg>
