<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c0a"/>
      <stop offset="50%" style="stop-color:#051a15"/>
      <stop offset="100%" style="stop-color:#020c0a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffc0"/>
      <stop offset="100%" style="stop-color:#009e88"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffc0"/>
      <stop offset="100%" style="stop-color:#009e88"/>
    </linearGradient>
    <linearGradient id="shadow3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004d3a"/>
      <stop offset="100%" style="stop-color:#002a20"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grille -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0,255,192,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fond -->

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Grille subtile -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Halo lumineux gauche -->

  <ellipse cx="200" cy="315" rx="300" ry="300" fill="#00ffc0" opacity="0.04" filter="url(#softglow)"/>
  <!-- Halo lumineux droite -->
  <ellipse cx="1050" cy="200" rx="200" ry="200" fill="#2D6BE4" opacity="0.05" filter="url(#softglow)"/>

  <!-- Bordure cadre -->

  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(0,255,192,0.15)" stroke-width="1.5"/>

  <!-- === LOGO DB 3D grand === -->

  <!-- Ombres 3D -->

<text x="83" y="358" font-family="'Arial Black', Impact, sans-serif" font-size="260" font-weight="900" fill="url(#shadow3d)" opacity="0.8">DB</text>
<text x="86" y="361" font-family="'Arial Black', Impact, sans-serif" font-size="260" font-weight="900" fill="url(#shadow3d)" opacity="0.5">DB</text>
<text x="89" y="364" font-family="'Arial Black', Impact, sans-serif" font-size="260" font-weight="900" fill="url(#shadow3d)" opacity="0.25">DB</text>

  <!-- Face principale -->

<text x="80" y="355" font-family="'Arial Black', Impact, sans-serif" font-size="260" font-weight="900" fill="url(#textGrad)" filter="url(#glow)">DB</text>

  <!-- Ligne séparatrice verticale -->

  <line x1="660" y1="80" x2="660" y2="550" stroke="rgba(0,255,192,0.15)" stroke-width="1"/>

  <!-- Côté droit — Texte -->

  <!-- Badge -->

  <rect x="700" y="120" width="220" height="36" rx="18" fill="rgba(0,255,192,0.08)" stroke="rgba(0,255,192,0.3)" stroke-width="1"/>
  <text x="810" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#00ffc0" text-anchor="middle" letter-spacing="2">AGENCE WEB · GAP</text>

  <!-- Nom -->

<text x="700" y="230" font-family="'Arial Black', Impact, sans-serif" font-size="80" font-weight="900" fill="#ffffff">STUDIO</text>

  <!-- Ligne accent -->

  <rect x="700" y="248" width="380" height="3" rx="2" fill="url(#accentGrad)"/>

  <!-- Tagline -->

<text x="700" y="310" font-family="Arial, sans-serif" font-size="24" fill="#8ab5ad" font-weight="300">Sites web professionnels pour</text>
<text x="700" y="342" font-family="Arial, sans-serif" font-size="24" fill="#8ab5ad" font-weight="300">entrepreneurs & artisans locaux</text>

  <!-- Points clés -->

  <circle cx="714" cy="404" r="4" fill="#00ffc0"/>
  <text x="730" y="410" font-family="Arial, sans-serif" font-size="19" fill="#e8f5f2">Livraison en 48h</text>

  <circle cx="714" cy="444" r="4" fill="#00ffc0"/>
  <text x="730" y="450" font-family="Arial, sans-serif" font-size="19" fill="#e8f5f2">Maquette gratuite</text>

  <circle cx="714" cy="484" r="4" fill="#00ffc0"/>
  <text x="730" y="490" font-family="Arial, sans-serif" font-size="19" fill="#e8f5f2">Basés à Gap, Hautes-Alpes</text>

  <!-- URL bas droite -->

<text x="1176" y="600" font-family="Arial, sans-serif" font-size="16" fill="rgba(138,181,173,0.5)" text-anchor="end">getdbstudio.fr</text>
</svg>
